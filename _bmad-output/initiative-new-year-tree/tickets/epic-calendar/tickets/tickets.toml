# A container's agreed children, in its tickets/ folder; tickets.py ignores unknown keys.
# Table order is build order. `id` is permanent, never reused.
# One kind of table per file: an initiative with no epics uses [[entry]] tables, a parent initiative [[initiative]] tables.
# No status here: the plan carries `status`; `tickets.py mirror` writes `tracker_status` to the leaf.
# next_id = 3 # written by `tickets.py move`; the folder's counter never goes below it

[[entry]]
id = 1
type = "story"
title = "Счётчик дней и звезда на сцене"
description = "Tracer bullet: тончайший путь через дату, DOM и контракт рендера. Чистая функция считает дни до Нового года по локальной дате (подстановка даты в тестах). Счётчик «N дней до Нового года» показывается сверху страницы как тихий элемент. Звезда регистрируется одним объектом контракта epic-scene поверх ёлки (слой 21, выше гирлянды 20) и рисуется объёмным гладким объектом по docs/style.md: скруглённый силуэт, градиент, блик верх-слева, мягкое свечение, без плоских прямоугольников. Запуск стартера и открытие страницы — шаг человека. Чистая функция даты и зарегистрированная звезда передаются в story 2: она добавляет к ним кривую яркости и пик."
verify = "Человек запускает npm run dev и видит счётчик дней сверху и звезду на верхушке; подстановка даты меняет число дней; тесты чистой функции даты, DOM-счётчика и регистрации звезды проходят; сборка зелёная."
covers = ["R1", "R3"]
after = []
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Рост яркости звезды и пик 31 декабря"
description = "Наименее уверенная часть: непрерывная функция яркости от остатка дней (0–31, максимум 31 декабря) управляет звездой. 31 декабря звезда и сияние всей ёлки достигают максимума: календарь переключает setPeakGlow() уже зарегистрированной гирлянды epic-garland, поэтому glow рисуется один раз в её слое 20 под огоньками, с общим rise ритуала; публичный setState и контракт рендера не меняются, логика сияния не дублируется. Вне окна 31 дня звезда держит тихий базовый свет. Мягкое свечение звезды строится по docs/style.md — это вклад story в R3. Поведение проверяется подстановкой даты."
verify = "При остатке 31, 10, 1 день и 31 декабря яркость звезды растёт и достигает максимума 31 декабря; в пике включено мягкое сияние ёлки; тесты подстановки даты и пика проходят."
covers = ["R2", "R3"]
after = ["epic-garland", 1]
hitl = false
risk = "medium"
