# A container's agreed children, in its tickets/ folder; tickets.py ignores unknown keys.
# Table order is build order. `id` is permanent, never reused.
# One kind of table per file: an initiative with no epics uses [[entry]] tables, a parent initiative [[initiative]] tables.
# No status here: the plan carries `status`; `tickets.py mirror` writes `tracker_status` to the leaf.
# next_id = 6 # written by `tickets.py move`; the folder's counter never goes below it

[[entry]]
id = 1
type = "story"
title = "Сквозной рост: пороги и города"
description = "Tracer bullet: тончайший путь через все слои эпика — общий счётчик визитов из ответа сервера epic-garland (уже приходит в клиент), одна таблица порогов 10/30/60, один объект на контракте рендера epic-scene и первый новый слой — города с зажигающимися окнами на слое 6 при счётчике ≥ 10. Снег и лес остаются слоями ритуала epic-scene и не дублируются. Здания — скруглённые, с градиентом, бликом верх-слева и мягкими окнами по docs/style.md; гирлянда (20) и звезда (21) не меняются. Запуск локального стартера и открытие страницы отложены до финальной проверки 4.5; живая двухбраузерная приёмка в этой story не заявлена."
verify = "Тесты таблицы порогов 10/30/60, регистрации одного объекта и отрисовки городов проходят; при счётчике ниже 10 их нет; сборка зелёная. Локальный стартер и живая проверка в двух браузерах отложены до story 4.5."
covers = ["R8", "R12"]
after = ["epic-garland"]
hitl = false
risk = "medium"

