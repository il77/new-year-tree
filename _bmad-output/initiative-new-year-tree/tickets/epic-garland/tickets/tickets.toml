# A container's agreed children, in its tickets/ folder; tickets.py ignores unknown keys.
# Table order is build order. `id` is permanent, never reused.
# One kind of table per file: an initiative with no epics uses [[entry]] tables, a parent initiative [[initiative]] tables.
# No status here: the plan carries `status`; `tickets.py mirror` writes `tracker_status` to the leaf.
# next_id = 7 # written by `tickets.py move`; the folder's counter never goes below it

[[entry]]
id = 1
type = "story"
title = "Сквозной огонёк: сервер, счётчик, гирлянда"
description = "Tracer bullet: тончайший путь через все слои эпика — расширить статический сервер одним запросом визита, завести папку с файлами состояния, вернуть клиенту seed от даты/времени, показать общий счётчик внизу страницы и зарегистрировать один огонёк гирлянды в контракте рендера на слое 20 (docs/contract.md, docs/style.md). Запуск сервера и открытие двух браузеров — шаг человека."
verify = "Человек запускает npm run dev и открывает страницу в двух браузерах: визит в одном зажигает огонёк и увеличивает счётчик в обоих; тесты сервера, клиента и регистрации проходят."
covers = ["R1", "R2", "R3", "R6"]
after = ["epic-scene"]
hitl = true
risk = "high"

